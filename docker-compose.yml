services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: city-cleanup-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_PATH=/app/data/city-cleanup.db
      - EVIDENCE_STORAGE_PATH=/app/data/evidence
      - EVIDENCE_PERCEPTUAL_DISTANCE_THRESHOLD=12
      - EVIDENCE_SCENE_HIGH_RISK_BELOW=0.30
      - EVIDENCE_SCENE_MEDIUM_RISK_BELOW=0.48
      - EVIDENCE_SYNTHETIC_HIGH_RISK_AT=0.60
      - EVIDENCE_SYNTHETIC_MEDIUM_RISK_AT=0.25
      - CORS_ORIGIN=http://localhost,http://localhost:19006
      - CELO_REWARDS_ENABLED=false
      - CELO_REWARD_DRY_RUN=true
      - CELO_RPC_URL=https://forno.celo-sepolia.celo-testnet.org
      - CELO_CHAIN_ID=11142220
      - CELO_REQUIRED_CONFIRMATIONS=2
      - CELO_TREASURY_MIN_BALANCE=0.10
      - WALLET_VERIFICATION_DOMAIN=localhost
      - WALLET_VERIFICATION_URI=http://localhost
      - WALLET_CHALLENGE_TTL_MS=600000
      - API_RATE_LIMIT=100
      - AUTH_RATE_LIMIT=20
      - RATE_LIMIT_WINDOW_MS=900000
      - JSON_BODY_LIMIT_BYTES=1048576
      - TRUST_PROXY_HOPS=0
      - USE_CLOUD_STORAGE=false
      - METRICS_ENABLED=true
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend-data:/app/data
    networks:
      - city-cleanup-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Web Service
  frontend:
    build:
      context: ./city-cleanup-challenge
      dockerfile: Dockerfile
    container_name: city-cleanup-frontend
    ports:
      - "80:8080"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:3001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - city-cleanup-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development Frontend (Expo)
  frontend-dev:
    build:
      context: ./city-cleanup-challenge
      dockerfile: Dockerfile.dev
    container_name: city-cleanup-frontend-dev
    ports:
      - "19006:19006"
      - "19000:19000"
      - "19001:19001"
    environment:
      - NODE_ENV=development
      - REACT_NATIVE_PACKAGER_HOSTNAME=localhost
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    volumes:
      - ./city-cleanup-challenge:/app
      - /app/node_modules
    networks:
      - city-cleanup-network
    restart: unless-stopped
    stdin_open: true
    tty: true
    profiles:
      - dev

  # PostgreSQL Database (optional upgrade from SQLite)
  postgres:
    image: postgres:17.10-alpine3.23
    container_name: city-cleanup-postgres
    environment:
      - POSTGRES_DB=city_cleanup
      - POSTGRES_USER=cleanup_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - city-cleanup-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanup_user -d city_cleanup"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: city-cleanup-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - city-cleanup-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - cache

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: city-cleanup-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - city-cleanup-network
    restart: unless-stopped
    profiles:
      - proxy

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: city-cleanup-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts
      - ./rendered-monitoring/metrics-token:/etc/prometheus/secrets/metrics-token:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - city-cleanup-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:13.1.0
    container_name: city-cleanup-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - city-cleanup-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:3.7.2
    container_name: city-cleanup-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - city-cleanup-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Alertmanager - Alert Management
  alertmanager:
    image: prom/alertmanager:v0.32.1
    container_name: city-cleanup-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./rendered-monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    networks:
      - city-cleanup-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:v1.11.1
    container_name: city-cleanup-node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - city-cleanup-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  city-cleanup-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  alertmanager-data:
    driver: local
