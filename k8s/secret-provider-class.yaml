apiVersion: v1
kind: ServiceAccount
metadata:
  name: city-cleanup-backend
  namespace: city-cleanup
  annotations:
    azure.workload.identity/client-id: replace-with-managed-identity-client-id
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: city-cleanup-key-vault
  namespace: city-cleanup
spec:
  provider: azure
  secretObjects:
    - secretName: city-cleanup-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
        - objectName: jwt-access-secret
          key: JWT_ACCESS_SECRET
        - objectName: jwt-refresh-secret
          key: JWT_REFRESH_SECRET
        - objectName: metrics-token
          key: METRICS_TOKEN
        - objectName: celo-treasury-private-key
          key: CELO_TREASURY_PRIVATE_KEY
        - objectName: aws-access-key-id
          key: AWS_ACCESS_KEY_ID
        - objectName: aws-secret-access-key
          key: AWS_SECRET_ACCESS_KEY
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: replace-with-managed-identity-client-id
    keyvaultName: replace-with-key-vault-name
    tenantId: replace-with-azure-tenant-id
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: jwt-access-secret
          objectType: secret
        - |
          objectName: jwt-refresh-secret
          objectType: secret
        - |
          objectName: metrics-token
          objectType: secret
        - |
          objectName: celo-treasury-private-key
          objectType: secret
        - |
          objectName: aws-access-key-id
          objectType: secret
        - |
          objectName: aws-secret-access-key
          objectType: secret
