apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: city-cleanup
  labels:
    app: backend
    version: v1
spec:
  # SQLite requires a single writer. Increase this only after migrating to a
  # shared production database and validating multi-replica reward locking.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/metrics"
        prometheus.io/port: "3001"
    spec:
      containers:
      - name: backend
        image: citycleanup.azurecr.io/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PORT
        - name: DATABASE_PATH
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: DATABASE_PATH
        - name: EVIDENCE_STORAGE_PATH
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: EVIDENCE_STORAGE_PATH
        - name: EVIDENCE_PERCEPTUAL_DISTANCE_THRESHOLD
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: EVIDENCE_PERCEPTUAL_DISTANCE_THRESHOLD
        - name: EVIDENCE_SCENE_HIGH_RISK_BELOW
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: EVIDENCE_SCENE_HIGH_RISK_BELOW
        - name: EVIDENCE_SCENE_MEDIUM_RISK_BELOW
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: EVIDENCE_SCENE_MEDIUM_RISK_BELOW
        - name: EVIDENCE_SYNTHETIC_HIGH_RISK_AT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: EVIDENCE_SYNTHETIC_HIGH_RISK_AT
        - name: EVIDENCE_SYNTHETIC_MEDIUM_RISK_AT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: EVIDENCE_SYNTHETIC_MEDIUM_RISK_AT
        - name: CORS_ORIGIN
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: CORS_ORIGIN
        - name: CELO_REWARDS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: CELO_REWARDS_ENABLED
        - name: CELO_REWARD_DRY_RUN
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: CELO_REWARD_DRY_RUN
        - name: CELO_RPC_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: CELO_RPC_URL
        - name: CELO_CHAIN_ID
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: CELO_CHAIN_ID
        - name: CELO_REWARD_CONTRACT_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: CELO_REWARD_CONTRACT_ADDRESS
        - name: CELO_REQUIRED_CONFIRMATIONS
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: CELO_REQUIRED_CONFIRMATIONS
        - name: CELO_TREASURY_MIN_BALANCE
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: CELO_TREASURY_MIN_BALANCE
        - name: WALLET_VERIFICATION_DOMAIN
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: WALLET_VERIFICATION_DOMAIN
        - name: WALLET_VERIFICATION_URI
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: WALLET_VERIFICATION_URI
        - name: WALLET_CHALLENGE_TTL_MS
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: WALLET_CHALLENGE_TTL_MS
        - name: METRICS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: METRICS_ENABLED
        - name: CELO_TREASURY_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: city-cleanup-secrets
              key: CELO_TREASURY_PRIVATE_KEY
              optional: true
        - name: JWT_ACCESS_SECRET
          valueFrom:
            secretKeyRef:
              name: city-cleanup-secrets
              key: JWT_ACCESS_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: city-cleanup-secrets
              key: JWT_REFRESH_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: backend-data
          mountPath: /app/data
      volumes:
      - name: backend-data
        persistentVolumeClaim:
          claimName: backend-data-pvc
      imagePullSecrets:
      - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: city-cleanup
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: city-cleanup
spec:
  # Deliberately fixed at one while SQLite is the persistence layer.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
